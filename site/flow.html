<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flow — Flowscope</title>
  <meta name="description" content="Step through a complete mobile user flow, or play it in interactive prototype mode.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="flow">
<main>
  <div class="container section-sm">
    <p style="margin-bottom:16px"><a href="browse.html?tab=flows">← Back to flows</a></p>
    <div id="content">
      <div class="state-box"><div class="skeleton" style="height:420px; max-width:420px; margin:0 auto"></div></div>
    </div>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
/* flow.html — flow player.
   Modes: "Steps" (captioned step-through) and "Prototype" (pulsing hotspots;
   clicking the right hotspot advances, wrong taps ripple).
   Exposes window.FlowscopeFlow.step(dir) for arrow-key navigation. */
(function () {
  'use strict';
  var F = window.Flowscope, D = F.data, esc = F.esc;

  var flow = null, steps = [], idx = 0, mode = 'steps';

  function currentStep() { return steps[idx]; }

  function renderShell() {
    document.getElementById('content').innerHTML =
      '<div class="flow-shell">' +
        '<span class="eyebrow">' + esc(flow.category || 'User flow') + '</span>' +
        '<h1 style="font-size:2rem">' + esc(flow.title) + '</h1>' +
        '<p class="muted">' + esc(flow.app_name || '') + ' · ' + steps.length + ' steps · ' + esc(flow.platform || '') + '</p>' +
        (flow.description ? '<p style="margin-top:8px">' + esc(flow.description) + '</p>' : '') +
        '<div class="tabs" style="margin-top:16px; margin-bottom:0">' +
          '<button class="tab active" data-mode="steps">Steps</button>' +
          '<button class="tab" data-mode="prototype">Prototype mode</button>' +
        '</div>' +
        '<div class="flow-progress" role="progressbar" aria-label="Flow progress"><div class="bar" id="flow-bar"></div></div>' +
        '<div class="flow-stage" id="flow-stage"></div>' +
        '<p class="flow-caption" id="flow-caption"></p>' +
        '<div class="step-dots" id="step-dots"></div>' +
        '<div class="flow-nav">' +
          '<button class="btn btn-ghost" id="f-prev">← Previous</button>' +
          '<span class="small muted" id="f-count"></span>' +
          '<button class="btn btn-primary" id="f-next">Next →</button>' +
        '</div>' +
        '<div class="btn-row" style="margin-top:16px; justify-content:center">' +
          '<button class="btn btn-ghost btn-sm" id="f-save">♥ Save flow to collection</button>' +
        '</div>' +
      '</div>';

    document.querySelectorAll('[data-mode]').forEach(function (b) {
      b.addEventListener('click', function () {
        mode = b.getAttribute('data-mode');
        document.querySelectorAll('[data-mode]').forEach(function (x) {
          x.classList.toggle('active', x === b);
        });
        renderStep();
      });
    });
    document.getElementById('f-prev').addEventListener('click', function () { step(-1); });
    document.getElementById('f-next').addEventListener('click', function () { step(1); });
    document.getElementById('f-save').addEventListener('click', function () { F.saveToCollectionDialog(flow.id, 'flow'); });

    // Step dots (thumbnails)
    document.getElementById('step-dots').innerHTML = steps.map(function (s, i) {
      return '<button class="step-dot" data-dot="' + i + '" aria-label="Go to step ' + (i + 1) + '">' +
        '<img src="' + esc(s.img) + '" alt="" loading="lazy"></button>';
    }).join('');
    document.querySelectorAll('[data-dot]').forEach(function (b) {
      b.addEventListener('click', function () { idx = parseInt(b.getAttribute('data-dot'), 10); renderStep(); });
    });
  }

  function renderStep() {
    var s = currentStep();
    if (!s) return;
    var stage = document.getElementById('flow-stage');
    var pct = Math.round(((idx + 1) / steps.length) * 100);
    document.getElementById('flow-bar').style.width = pct + '%';
    document.getElementById('f-count').textContent = 'Step ' + (idx + 1) + ' of ' + steps.length;
    document.getElementById('flow-caption').innerHTML =
      '<strong>Step ' + (idx + 1) + ':</strong> ' + esc(s.caption || s.title || '');

    document.querySelectorAll('[data-dot]').forEach(function (b, i) {
      b.classList.toggle('active', i === idx);
    });

    if (mode === 'prototype') {
      // Interactive: pulsing hotspot(s); right tap advances, wrong tap ripples.
      var spots = (s.hotspots || []).map(function (h) {
        return '<button class="hotspot" data-label="' + esc(h.label || 'Tap') + '" ' +
          'style="left:' + h.x + '%; top:' + h.y + '%" data-hx="' + h.x + '" data-hy="' + h.y + '" aria-label="' + esc(h.label || 'Hotspot') + '"></button>';
      }).join('');
      stage.innerHTML = '<div class="step-wrap" id="proto-wrap">' +
        '<img class="step-img" src="' + esc(s.img) + '" alt="' + esc(s.caption || '') + '" style="width:100%">' + spots +
        (s.hotspots && s.hotspots.length
          ? '<p class="small muted" style="text-align:center; margin-top:8px">Tap the pulsing hotspot to continue</p>'
          : '<p class="small muted" style="text-align:center; margin-top:8px">No hotspot on this step — use Next →</p>') +
        '</div>';

      var wrap = document.getElementById('proto-wrap');
      wrap.querySelectorAll('.hotspot').forEach(function (h) {
        h.addEventListener('click', function (e) { e.stopPropagation(); step(1); });
      });
      wrap.addEventListener('click', function (e) {
        if (e.target.closest('.hotspot')) return;
        // Wrong tap: red ripple at tap point.
        var r = wrap.getBoundingClientRect();
        var x = ((e.clientX - r.left) / r.width) * 100;
        var y = ((e.clientY - r.top) / r.height) * 100;
        var rip = document.createElement('span');
        rip.className = 'ripple';
        rip.style.left = x + '%'; rip.style.top = y + '%';
        wrap.appendChild(rip);
        setTimeout(function () { rip.remove(); }, 550);
      });
    } else {
      stage.innerHTML = '<img class="step-img" src="' + esc(s.img) + '" alt="' + esc(s.caption || '') + '">';
    }

    document.getElementById('f-prev').disabled = idx === 0;
    document.getElementById('f-prev').style.opacity = idx === 0 ? '.4' : '1';
    document.getElementById('f-next').textContent = idx === steps.length - 1 ? 'Restart ⟲' : 'Next →';
  }

  function step(dir) {
    if (dir > 0 && idx === steps.length - 1) idx = 0;
    else idx = Math.min(steps.length - 1, Math.max(0, idx + dir));
    renderStep();
  }
  window.FlowscopeFlow = { step: step };

  document.addEventListener('DOMContentLoaded', function () {
    var id = F.getParam('id');
    D.loadAll().then(function (all) {
      if (D.hadErrors() && !all.flows.length) { F.showDataError(D.getErrors()); return; }
      flow = D.byId(all.flows, id);
      if (!flow || !(flow.steps && flow.steps.length)) {
        document.getElementById('content').innerHTML =
          '<div class="state-box"><div class="big">🧭</div><h3>Flow not found</h3>' +
          '<p>This flow doesn\'t exist or has no steps.</p>' +
          '<a class="btn btn-ghost" href="browse.html?tab=flows">Back to flows</a></div>';
        return;
      }
      document.title = flow.title + ' — Flowscope';
      steps = flow.steps.map(function (st) {
        var scr = D.byId(all.screens, st.screen_id);
        return {
          screen_id: st.screen_id,
          caption: st.caption,
          title: scr ? scr.title : '',
          img: scr ? D.assetUrl(scr.image) : '',
          hotspots: st.hotspot ? [st.hotspot] : []
        };
      });
      renderShell();
      renderStep();
    });
  });
})();
</script>
</body>
</html>
